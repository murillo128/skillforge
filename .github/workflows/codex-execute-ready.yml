name: Execute execution-ready issue with local Codex

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: codex-${{ github.repository }}-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.label.name == 'execution-ready'
    runs-on: [self-hosted, codex]

    env:
      SKILLFORGE_LOCAL_RUNNER: "1"

    steps:
      - name: Prepare persistent issue worktree
        id: worktree
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          : "${SKILLFORGE_REPO_ROOT:?SKILLFORGE_REPO_ROOT must point to the persistent local checkout for this repository}"

          repo_root="$(cd "$SKILLFORGE_REPO_ROOT" && pwd -P)"
          git -C "$repo_root" rev-parse --is-inside-work-tree >/dev/null

          origin="$(git -C "$repo_root" remote get-url origin)"
          case "$origin" in
            "https://github.com/${GITHUB_REPOSITORY}"|"https://github.com/${GITHUB_REPOSITORY}.git"|"git@github.com:${GITHUB_REPOSITORY}"|"git@github.com:${GITHUB_REPOSITORY}.git"|"ssh://git@github.com/${GITHUB_REPOSITORY}"|"ssh://git@github.com/${GITHUB_REPOSITORY}.git") ;;
            *) echo "SKILLFORGE_REPO_ROOT points to unexpected origin: $origin" >&2; exit 1 ;;
          esac

          fetched=false
          for attempt in 1 2 3; do
            if git -C "$repo_root" fetch --prune origin; then
              fetched=true
              break
            fi
            sleep "$attempt"
          done
          test "$fetched" = true
          git -C "$repo_root" worktree prune

          worktree_base="${SKILLFORGE_WORKTREE_ROOT:-${HOME}/.skillforge/worktrees}"
          repo_key="${GITHUB_REPOSITORY//\//-}"
          worktree="${worktree_base}/${repo_key}/issue-${ISSUE_NUMBER}"
          branch="codex/issue-${ISSUE_NUMBER}"
          mkdir -p "$(dirname "$worktree")"

          if git -C "$worktree" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            current_branch="$(git -C "$worktree" symbolic-ref --quiet --short HEAD || true)"
            if [ "$current_branch" != "$branch" ]; then
              echo "Existing issue worktree uses unexpected branch: ${current_branch:-DETACHED}" >&2
              exit 1
            fi
          else
            if [ -e "$worktree" ] && [ -n "$(ls -A "$worktree" 2>/dev/null || true)" ]; then
              echo "Issue worktree path exists but is not a Git worktree: $worktree" >&2
              exit 1
            fi
            rmdir "$worktree" 2>/dev/null || true

            if git -C "$repo_root" show-ref --verify --quiet "refs/heads/$branch"; then
              git -C "$repo_root" worktree add "$worktree" "$branch"
            elif git -C "$repo_root" show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              git -C "$repo_root" branch --track "$branch" "origin/$branch"
              git -C "$repo_root" worktree add "$worktree" "$branch"
            else
              git -C "$repo_root" worktree add -b "$branch" "$worktree" "origin/$DEFAULT_BRANCH"
            fi
          fi

          echo "path=$worktree" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Launch controlling issue as detached Codex session
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SKILLFORGE_ISSUE_WORKTREE: ${{ steps.worktree.outputs.path }}
          SKILLFORGE_ISSUE_BRANCH: ${{ steps.worktree.outputs.branch }}
        run: |
          set -euo pipefail
          command -v codex >/dev/null
          command -v python3 >/dev/null
          command -v setsid >/dev/null

          repo_key="${GITHUB_REPOSITORY//\//-}"
          state_dir="${HOME}/.skillforge/run/${repo_key}/issue-${ISSUE_NUMBER}"
          log_dir="${SKILLFORGE_LOG_ROOT:-${HOME}/.skillforge/logs}/${repo_key}"
          pid_file="${state_dir}/codex.pid"
          launcher="${state_dir}/launch-codex.sh"
          pty_runner="${state_dir}/pty-runner.py"
          log_file="${log_dir}/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}.log"
          mkdir -p "$state_dir" "$log_dir"

          if [ -f "$pid_file" ]; then
            existing_pid="$(cat "$pid_file" 2>/dev/null || true)"
            if [ -n "$existing_pid" ] && kill -0 "$existing_pid" 2>/dev/null; then
              echo "Codex session for issue #${ISSUE_NUMBER} is already running as pid ${existing_pid}; refusing a duplicate launch."
              exit 0
            fi
            rm -f "$pid_file"
          fi

          cat > "$launcher" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          unset CI GITHUB_ACTIONS GH_TOKEN GITHUB_TOKEN
          export RUNNER_TRACKING_ID=""
          if [ -z "${TERM:-}" ] || [ "${TERM:-}" = "dumb" ]; then
            export TERM=xterm-256color
          fi
          exec codex --ask-for-approval on-request \
            --cd "$SKILLFORGE_ISSUE_WORKTREE" \
            --no-alt-screen \
            --sandbox workspace-write \
            -c 'approvals_reviewer="auto_review"' \
            -c 'sandbox_workspace_write.network_access=true' \
            "Execute GitHub issue #${ISSUE_NUMBER} according to AGENTS.md."
          EOF
          chmod 700 "$launcher"

          cat > "$pty_runner" <<'PY'
          #!/usr/bin/env python3
          import errno
          import os
          import pty
          import select
          import signal
          import sys

          if len(sys.argv) < 3:
              raise SystemExit("usage: pty-runner.py LOG COMMAND [ARG ...]")

          log_path = sys.argv[1]
          command = sys.argv[2:]
          child_pid, master_fd = pty.fork()
          if child_pid == 0:
              os.execvp(command[0], command)

          def forward(signum, _frame):
              try:
                  os.kill(child_pid, signum)
              except ProcessLookupError:
                  pass

          signal.signal(signal.SIGTERM, forward)
          signal.signal(signal.SIGINT, forward)
          status = None

          with open(log_path, "ab", buffering=0) as log:
              while status is None:
                  try:
                      readable, _, _ = select.select([master_fd], [], [], 0.5)
                  except InterruptedError:
                      continue

                  if readable:
                      try:
                          data = os.read(master_fd, 65536)
                      except OSError as exc:
                          if exc.errno != errno.EIO:
                              raise
                          data = b""
                      if data:
                          log.write(data)

                  done, child_status = os.waitpid(child_pid, os.WNOHANG)
                  if done == child_pid:
                      status = child_status

              while True:
                  try:
                      readable, _, _ = select.select([master_fd], [], [], 0)
                      if not readable:
                          break
                      data = os.read(master_fd, 65536)
                  except OSError as exc:
                      if exc.errno == errno.EIO:
                          break
                      raise
                  if not data:
                      break
                  log.write(data)

          os.close(master_fd)
          raise SystemExit(os.waitstatus_to_exitcode(status))
          PY
          chmod 700 "$pty_runner"

          RUNNER_TRACKING_ID="" nohup setsid -w python3 "$pty_runner" "$log_file" "$launcher" >/dev/null 2>>"$log_file" &
          codex_pid=$!
          printf '%s\n' "$codex_pid" > "$pid_file"
          printf '%s\n' "$log_file" > "${state_dir}/latest-log"

          sleep 2
          if ! kill -0 "$codex_pid" 2>/dev/null; then
            echo "Detached Codex session failed to stay running." >&2
            tail -n 80 "$log_file" >&2 || true
            rm -f "$pid_file"
            exit 1
          fi

          echo "Detached Codex session launched for issue #${ISSUE_NUMBER} (pid ${codex_pid})."
          echo "Local transcript: ${log_file}"
