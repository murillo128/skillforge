name: Prepare reviewed epic synchronization

on:
  push:
    branches: [codex/issue-1]
    paths: [.github/workflows/prepare-epic-sync.yml]

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: murillo128/nfl-world-model
          ref: 9fc8e8f0636d4adf0160e9c0d0ecd500c4eb4b4d
          path: source-nfl
          persist-credentials: false
          sparse-checkout: |
            .github
            .codex
            skills
            docs
      - uses: actions/checkout@v4
        with:
          repository: murillo128/llm-model-explorer
          ref: ce5bff20039d6dc2381852bbef07f77273e32553
          path: source-llm
          persist-credentials: false
          sparse-checkout: |
            .github
            .codex
            skills
            docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare pinned sources and prepare scoped candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          nfl = root.parent / 'source-nfl'
          llm = root.parent / 'source-llm'
          output = Path(os.environ['RUNNER_TEMP']) / 'epic-sync-report'
          output.mkdir()
          manifest = json.loads((nfl / '.github/sdd-upstream.json').read_text())
          assert manifest['commit'] == 'ce5bff20039d6dc2381852bbef07f77273e32553'
          paths = set(manifest['imported_paths']) | {
              '.github/scripts/cleanup_issue_worktrees.py',
              '.github/scripts/devin_host_broker.py',
              '.github/scripts/devin_host_client.py',
              '.github/scripts/test_worktree_cleanup.py',
              '.github/scripts/test_epic_scheduler.py',
          }
          allowed_roots = {'.codex', '.github', 'skills', 'docs'}
          def blob(data):
              return None if data is None else hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          rows = []
          delta = []
          for name in sorted(paths):
              assert Path(name).parts[0] in allowed_roots and '..' not in Path(name).parts
              source = (nfl / name).read_bytes()
              target = (root / name).read_bytes() if (root / name).is_file() else None
              upstream = (llm / name).read_bytes() if (llm / name).is_file() else None
              category = 'unchanged' if target == source else ('shared-baseline' if upstream == source else 'nfl-delta')
              rows.append({'path': name, 'category': category, 'skillforge_before': blob(target), 'llm_blob': blob(upstream), 'nfl_blob': blob(source)})
              if upstream != source:
                  delta.extend(difflib.unified_diff((upstream or b'').decode().splitlines(keepends=True), source.decode().splitlines(keepends=True), fromfile='llm/' + name, tofile='nfl/' + name))
              if target != source:
                  (root / name).parent.mkdir(parents=True, exist_ok=True)
                  (root / name).write_bytes(source)

          # Keep reusable operating policy; do not turn one NFL host's history into
          # canonical template facts. Do not import either application's AGENTS,
          # README, bootstrap state, datasets or application workflows.
          runners = root / 'docs/execution-runners.md'
          text = runners.read_text()
          start = text.find('\nOn 2026-09-25,')
          end = text.find('\nCLI references', start)
          assert start > 0 and end > start
          text = text[:start] + '\n\nLive-host readiness, CLI flags and model availability must be verified separately\nfor the intended host/account. No application-specific live-session history is\nclaimed as validation of this template.\n' + text[end:]
          runners.write_text(text)
          operations = root / 'docs/codex-operations.md'
          text = operations.read_text().replace(
              'GPU training hosts and local caches are separate from the coding-agent selection;\nthe imported router does not select or provision a GPU training host.\n',
              'Application compute hosts and local caches are separate from coding-agent\nselection; the router does not select or provision application infrastructure.\n')
          text = text.replace('interrupt training, change power\nlimits or restart a host/server', 'interrupt workloads or restart a host/server')
          operations.write_text(text)
          agents = root / 'AGENTS.md'
          text = agents.read_text()
          anchor = '- optional local runner provisioning/repair: `skills/codex-local-runner/SKILL.md`;'
          assert anchor in text
          text = text.replace(anchor, anchor + '\n- executor/model selection: `skills/execution-runner-selection/SKILL.md`;\n- optional local Devin runner provisioning/repair: `skills/devin-local-runner/SKILL.md`;')
          anchor = 'Keep this decision in agent instructions, not duplicated in the launcher workflow.'
          assert anchor in text
          text = text.replace(anchor, anchor + '\n\nExecutor selection is independent of model selection. Missing overrides retain native Codex behavior; an explicit local Devin selection changes implementation/scheduler execution, never the independent Codex audit. Read `docs/execution-runners.md` and `docs/codex-operations.md` for validated per-issue settings and host boundaries. Selection edits do not activate issues or release user holds.')
          anchor = 'Duplicate/delayed scheduler wake-ups are expected and must remain idempotent.'
          assert anchor in text
          text = text.replace(anchor, anchor + '\n\nThe same dispatcher handles issue closure with narrowly scoped terminal worktree cleanup: only the closed issue\'s registered implementation worktree and its associated detached review worktrees, after the audit lock is released. Open-issue work is preserved and branch refs are retained. Cleanup is not permission to launch a new model turn.')
          agents.write_text(text)
          readme = root / 'README.md'
          readme.write_text(readme.read_text() + '\n## Execution runners and regression checks\n\nEpic/issue execution supports native Codex selection and explicitly selected local Devin, with independent fresh Codex audit. See [execution runners](docs/execution-runners.md) and [Codex operating policy](docs/codex-operations.md). Runner provisioning is opt-in and is never performed inside canonical SkillForge.\n\nRun the offline regression suite with Python 3.11+ and tmux:\n\n```sh\nREQUIRE_TMUX_TEST=1 python3 -m unittest discover -s .github/scripts -p "test_*.py" -v\n```\n\nThese tests use temporary Git worktrees and fake model clients, not paid model calls or production runners. Import provenance is recorded in `.github/epic-sync-provenance.json`.\n')
          (root / '.github/workflows/prepare-epic-sync.yml').unlink()
          provenance = {
              'scope': 'Reusable epic execution skills, runners, workflows, and offline regressions',
              'skillforge_base': '747bf4766dec7c9e75384c31b601b5523b2dbb78',
              'sources': {'murillo128/nfl-world-model': '9fc8e8f0636d4adf0160e9c0d0ecd500c4eb4b4d', 'murillo128/llm-model-explorer': 'ce5bff20039d6dc2381852bbef07f77273e32553'},
              'adaptations': ['Preserve canonical SkillForge bootstrap, README and AGENTS; add only relevant generic routing.', 'Remove application-specific live-host/session observations and training terminology.', 'Do not import source-repository application code, data, application CI or local bootstrap state.'],
              'comparison': rows,
          }
          (root / '.github/epic-sync-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          (output / 'comparison.json').write_text(json.dumps(provenance, indent=2) + '\n')
          (output / 'nfl-vs-llm.patch').write_text(''.join(delta))
          subprocess.run(['git', 'add', '-A', '--', '.github', '.codex', 'skills', 'docs', 'README.md', 'AGENTS.md'], check=True)
          (output / 'skillforge.patch').write_text(subprocess.check_output(['git', 'diff', '--cached'], text=True))
          summary = ['## Pinned epic synchronization candidate', '', '| Path | Classification |', '| --- | --- |']
          summary += ['| `' + row['path'] + '` | ' + row['category'] + ' |' for row in rows]
          summary += ['', 'Source repositories remain unchanged. Canonical bootstrap remains intact. No paid model calls or self-hosted runner launches.', '', '### Scope check']
          hits = []
          for name in paths:
              for number, line in enumerate((root / name).read_text().splitlines(), 1):
                  if any(word in line for word in ('nfl-world-model', '/usr/local/src', 'super-marlin', '#139', '#146', 'A4500', '4070')):
                      hits.append(f'- `{name}:{number}`: {line}')
          summary += hits or ['No application-specific host/session strings found in imported paths.']
          (output / 'summary.md').write_text('\n'.join(summary) + '\n')
          print('\n'.join(summary))
          PY
          git diff --cached --check
      - name: Ensure real tmux transport
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y tmux
          fi
      - name: Run offline regression tests
        working-directory: candidate
        env:
          REQUIRE_TMUX_TEST: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/epic-sync-report/tests.log"
          python3 -m compileall -q .github/scripts skills
      - name: Validate workflow syntax
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -shellcheck= 2>&1 | tee "$RUNNER_TEMP/epic-sync-report/actionlint.log"
      - name: Store validated candidate objects without moving any branch
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'murillo128/skillforge'
          def api(path, data=None):
              req = Request('https://api.github.com/repos/' + repo + '/' + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urlopen(req, timeout=60) as response:
                  return json.load(response)
          parent = os.environ['GITHUB_SHA']
          base_tree = api('git/commits/' + parent)['tree']['sha']
          entries = []
          for record in subprocess.check_output(['git', 'diff', '--cached', '--name-status', '--no-renames'], text=True).splitlines():
              status, name = record.split('\t', 1)
              if status == 'D':
                  assert name == '.github/workflows/prepare-epic-sync.yml'
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              data = subprocess.check_output(['git', 'show', ':' + name])
              sha = api('git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})['sha']
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          tree = api('git/trees', {'base_tree': base_tree, 'tree': entries})['sha']
          commit = api('git/commits', {'message': 'feat(epics): synchronize reusable execution deltas (#1)\n\nPreserve canonical bootstrap and native model selection. Import the shared LLM baseline and NFL-only runner, cleanup and activation-hold fixes with regression coverage. No branch updated by the preparation workflow.', 'tree': tree, 'parents': [parent]})['sha']
          output = Path(os.environ['RUNNER_TEMP']) / 'epic-sync-report'
          report = {'candidate_commit': commit, 'candidate_tree': tree, 'parent_commit': parent, 'changed_paths': len(entries), 'tests': (output / 'tests.log').read_text().splitlines()[-5:], 'workflow_syntax': 'actionlint v1.7.7 passed (shellcheck disabled)', 'branches_updated': False}
          (output / 'candidate.json').write_text(json.dumps(report, indent=2) + '\n')
          body = (output / 'summary.md').read_text() + '\n### Validated unreferenced candidate\n```json\n' + json.dumps(report, indent=2) + '\n```\n\nThe temporary preparation workflow is absent from the candidate tree. Awaiting exact-head review/publication through the GitHub connector; main has not changed.\n'
          api('issues/1/comments', {'body': body})
          print(json.dumps(report, indent=2))
          PY
      - name: Retain comparison and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic-sync-report
          path: ${{ runner.temp }}/epic-sync-report/
          retention-days: 14
