name: Create review-ready label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-review-ready-label.yml'

permissions:
  contents: read
  issues: write

jobs:
  create-label:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure review-ready label exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/labels"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          status="$(curl -sS -o /tmp/review-ready-label.json -w '%{http_code}' "${auth[@]}" "${api}/review-ready")"
          if [ "$status" = "200" ]; then
            echo "review-ready already exists"
            exit 0
          fi
          if [ "$status" != "404" ]; then
            cat /tmp/review-ready-label.json >&2
            exit 1
          fi
          curl --fail-with-body -sS "${auth[@]}" -X POST "$api" \
            -d '{"name":"review-ready","color":"0E8A16","description":"Implementation complete and ready for user-facing review"}' \
            >/tmp/review-ready-label-created.json
          cat /tmp/review-ready-label-created.json
